formula = "task-work-reasoning"
version = 1
description = """
Execute a concrete task on a DEEP-REASONING model pin.

Identical in shape to `task-work` (implement -> verify), but every step
pins `model = "claude-opus-5"`. This is the ONLY in-zip channel that
carries a per-node model allocation onto a recipient machine: a spore
node has no `model` field, and the spore->nucleate path drops `--model`,
so the allocation must travel on the FORMULA STEP. cosmon honors a
per-step model pin, which ranks below an explicit `--model` / the
`ANTHROPIC_MODEL` env override and above every default. Bind the nodes
whose value is depth of reasoning to this formula: proof attempts, the
skeptic, the red-team corpus, the editorial adversary, the opening
decomposition.

GRACEFUL DEGRADATION: the pin is inert until the molecule is TACKLED
(germination and `cs spore validate` never touch it). A recipient who
lacks `claude-opus-5` overrides it per-molecule with
`cs tackle <id> --model <their-model>` or globally by exporting
`ANTHROPIC_MODEL=<their-model>` before the run — both rank ABOVE this
pin, so the DAG is unchanged and only the realized model differs. See
README "Model & adapter access".

THE ADAPTER AXIS (commented on both steps below). `model` names WHICH model;
`adapter` names WHICH RUNTIME talks to it — `claude` (Claude Code CLI in a
tmux pane) and `codex` (OpenAI Codex CLI, likewise) are two of the shipped
names. Both are formula-step fields with the same rank in their own chain:
below an explicit CLI flag, above env / config / the built-in floor. They
are INDEPENDENT axes, so moving one without the other yields an illegal
pair; cosmon carries the model id opaquely and the backend rejects it only
at launch.

This formula binds BOTH sides of two gates — `proof-attempt` (author) and
`skeptic` / `red-team-corpus` (scorers). If you split it by provider, split
it by NODE, not by formula: point the scorer nodes at a codex-pinned copy of
this file and leave `proof-attempt` on claude. Uncommenting the adapter line
here moves author AND scorer together, which buys a different provider but
NOT a clean room. See README §6bis.
"""
id_prefix = "task"

[vars.topic]
description = "The concrete task to execute, stated in one or more sentences."
required = true

# Tier 0 — leaf formula, no child nucleation.
[tier]
level = 0

[[steps]]
id = "implement"
title = "Implement the solution"
description = "Do the work. Read the project's CLAUDE.md for conventions."
acceptance = "Implementation complete, the leg's artifact emitted"
model = "claude-opus-5"
# CROSS-PROVIDER (README §6bis): to run THIS step on the OpenAI Codex CLI,
# uncomment `adapter` AND comment out the `model` pin above — a `claude-*` id
# is not legal for the `codex` adapter, and cosmon carries the id opaquely
# (the backend rejects the bad pair only at launch). With no model pin, the
# Codex CLI's own default applies.
# adapter = "codex"

[[steps]]
id = "verify"
title = "Verify and validate"
description = """
Verify the leg's artifact against its brief: internally consistent, every
claim justified or flagged as a gap, sources cited where applicable. If
the leg emitted code, run the project's gates (build / test / lint /
format / doc). Fix any issues.
"""
needs = ["implement"]
acceptance = "Artifact verified against its brief; gates (if code) green"
model = "claude-opus-5"
# CROSS-PROVIDER (README §6bis): to run THIS step on the OpenAI Codex CLI,
# uncomment `adapter` AND comment out the `model` pin above — a `claude-*` id
# is not legal for the `codex` adapter, and cosmon carries the id opaquely
# (the backend rejects the bad pair only at launch). With no model pin, the
# Codex CLI's own default applies.
# adapter = "codex"
