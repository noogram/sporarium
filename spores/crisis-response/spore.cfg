\* ==========================================================================
\* spore.cfg — TLC model for spore.tla (the crisis-response seal).
\*
\* LAUNCH (from inside spores/crisis-response/, any Java 11+ on PATH). The jar
\* ships in the cosmon repo at docs/specs/tla2tools.jar — point TLA2TOOLS_JAR at it:
\*   export TLA2TOOLS_JAR=/path/to/cosmon/docs/specs/tla2tools.jar
\*   java -XX:+UseParallelGC -cp "$TLA2TOOLS_JAR" tlc2.TLC \
\*        -workers auto -config spore.cfg spore.tla
\*
\* EXPECTED VERDICT: "Model checking completed. No error has been found."
\*
\* STATE SPACE: MEASURED green on OpenJDK 21.0.11 / TLC (tla2tools.jar), authoring
\* run 2026-07-29 (with the G4 realized-routing / model-lock / fallback-IOC
\* properties): 122204 distinct states (319584 generated), depth 26, ~2min44s.
\* (An earlier cut without the G4 routing state was 47324 distinct / depth 26.)
\* The model is deliberately small — two regimes, two actors, a 3-round epistemic
\* loop — comfortably inside TLC. Larger Regimes / MaxRounds hold A FORTIORI (the
\* loop variant grows a bounded scalar, not the topology). Re-run the command above
\* on any Java 11+ host to reproduce.
\*
\* MODEL SIZES (rationale):
\*   - Regimes = {"dora","rgpd"}: the live parallel case for a financial entity —
\*     DORA (ICT-incident) + RGPD (personal-data breach), with NIS2 DISPLACED by
\*     the lex-specialis rule (that displacement is a `cs spore validate`
\*     well-formedness expectation, not a seal property; see README/spore.toml). Two
\*     regimes is the SMALLEST model that gives NoResourceCollision teeth on the
\*     notice fan-out (notice-dora must stay disjoint from notice-rgpd) and lets
\*     NoSilentClockMiss quantify over more than one sink.
\*   - Actors = {"a1","a2"}: the smallest set that lets the two-leg countersign use
\*     two DISTINCT actors AND lets the evidence-write / production-write capability
\*     split land on different actors (SoDCapability). One actor could not exhibit
\*     the separation the property is about.
\*   - MaxRounds = 3: the SMALLEST bound that exercises the epistemic loop as a real
\*     machine — round 1 (open), round 2 (open), round 3 (the MaxRounds exhaustion
\*     => reconcile_v = EXHAUSTED), AND the RECONCILED fixpoint reachable at any
\*     round, INCLUDING round 0 (the `epistemic_rounds = 1` default, where the loop
\*     nucleates nothing and folds round 1's own confrontation). A bound of 1 would
\*     collapse the loop; 3 gives the exhaustion path and the reconciled path
\*     distinct depths. MaxRounds is a POSTURE for the model — it bounds the loop
\*     counter, it is NOT a node-set multiplier — so larger bounds hold A FORTIORI.
\*   - NULL = NoRegime: a model value distinct from every regime (the regime slot of
\*     a non-notice node).
\*   - delivery is a STATE variable (chosen at Init), so this single model covers
\*     BOTH delivery = "drill_only" (the shipped default: `applied` unreachable) AND
\*     "live" (an AUTHORIZED, floor-cleared single-shot `applied` reachable). No
\*     second config needed.
\*
\* NON-VACUITY (each state should be confirmed REACHABLE by running the model with
\* its negation as an invariant and observing the violation — do this when you run
\* it on a JVM host):
\*   * reconcile_v = "EXHAUSTED"                    (the cap path exists)
\*   * reconcile_v = "RECONCILED"                   (the fixpoint path exists)
\*   * round = MaxRounds                            (the loop really advances)
\*   * RECONCILED with round < MaxRounds            (RUNTIME EARLY EXIT exists)
\*   * RECONCILED with round = 0                    (the epistemic_rounds=1 fold)
\*   * gate_verdict = "AUTHORIZED" with delivery=live  (the full floor can clear)
\*   * remediation = "applied"                      (a live single-shot is reachable)
\*   * gate_verdict = "BLOCKED" with reconcile_v = "EXHAUSTED"  (block-and-escalate)
\*   * notice_status[g] = "escalated"               (fail-closed notice accounting)
\*
\* NEGATIVE TESTS (the properties have teeth — MEASURED: each mutation below was
\* run on the 2026-07-29 authoring host and REJECTED by TLC, i.e. it broke the seal;
\* re-run any of them to reproduce):
\*   * drop the `custody = "sealed"` clause from GateDecision            => EvidenceBeforeRemediation / GateNeverPromotesOnAbsence VIOLATED
\*   * let GateDecision AUTHORIZE on countersign = "single_actor"        => TwoLegCountersign VIOLATED
\*   * let GateDecision AUTHORIZE on corrob = "absent"                   => CorroborationBeforeAction VIOLATED
\*   * let GateDecision AUTHORIZE on reconcile_v = "EXHAUSTED"           => GateNeverPromotesOnAbsence VIOLATED (block-and-escalate lost)
\*   * let NoticeDecision draft on ratified[g] = FALSE                   => RatifiedClassificationBeforeNotice VIOLATED
\*   * drop the round index from RoundPath (make it constant)           => NoResourceCollision VIOLATED
\*   * wire blue_investigate downstream of red_reconstruct              => BlindBeforeConfrontation VIOLATED
\*   * drop the "prod ∉"/"ev ∉" guards in the two capability grants      => SoDCapability VIOLATED
\*   * add "external_free" to a restricted node's RealizableLocalities  => RoutingEnvelopeDeclared VIOLATED
\*   * widen realized_sens' to include "external_free"                  => RoutingConfinement + ModelLockOnSensitive VIOLATED
\*   * break the IOC coupling (fallback_ioc' = fallback_ioc on induced) => FallbackStormIsIOC VIOLATED
\*   * let ExecuteRemediation set "applied" under delivery="drill_only"  => DrillOnlyFloor VIOLATED
\*
\* No SYMMETRY: Termination is a liveness property and TLC refuses symmetry on
\* temporal properties.
\*
\* CHECK_DEADLOCK FALSE: a fully-drained DAG (every node Done) is the intended
\* terminal absorbing state, not a deadlock bug. Termination is checked as the
\* liveness PROPERTY instead.
\* ==========================================================================

SPECIFICATION Spec

CONSTANTS
    Regimes   = {"dora", "rgpd"}
    Actors    = {"a1", "a2"}
    MaxRounds = 3
    NULL      = NoRegime

INVARIANT
    SealInvariant

PROPERTY
    Termination

CHECK_DEADLOCK FALSE
